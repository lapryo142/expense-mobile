<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f3">
<title>Expense Mobile</title>
<style>
:root{--bg:#f5f5f3;--card:#fff;--text:#171717;--muted:#7b7b78;--line:#e6e4df;--green:#156a50;--red:#a6473e;--dark:#191919;--soft:#f0ede4}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,sans-serif}
body{min-height:100vh}.app{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}
.header{padding:18px 2px 10px}.monthline{display:flex;align-items:center;justify-content:space-between}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.7px}.small{font-size:12px;color:var(--muted)}
.months{display:flex;gap:6px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.months::-webkit-scrollbar{display:none}
.months button{border:0;background:#e9e8e4;color:#555;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:700;white-space:nowrap}.months button.active{background:var(--dark);color:#fff}
.balance{background:var(--dark);color:#fff;border-radius:18px;padding:18px 18px 16px;margin:12px 0}.balance .label{font-size:11px;color:#b8b8b8;font-weight:700;letter-spacing:.3px}
.balance .value{font-size:32px;font-weight:850;margin-top:5px;letter-spacing:-1px}.balance .meta{display:flex;gap:16px;margin-top:12px;font-size:12px;color:#c7c7c7}
.list{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}.tx{display:grid;grid-template-columns:1fr auto;gap:14px;padding:13px 15px;border-bottom:1px solid var(--line);align-items:center}.tx:last-child{border-bottom:0}
.tx-title{font-size:16px;font-weight:700;line-height:1.22}.tx-date{font-size:11px;color:var(--muted);margin-top:4px}.tx-money{font-size:16px;font-weight:800;white-space:nowrap}.tx-money.income{color:var(--green)}.tx-money.expense{color:var(--red)}
.empty{padding:36px 18px;text-align:center;color:var(--muted);font-size:13px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:min(402px,calc(100% - 28px));display:flex;gap:10px;z-index:20}
.fab button{flex:1;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;box-shadow:0 8px 30px rgba(0,0,0,.12)}.add{background:var(--dark);color:#fff}.overview-btn{background:#fff;color:var(--dark);border:1px solid var(--line)!important}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-end;z-index:50}.sheet.open{display:flex}
.panel{width:100%;max-width:430px;margin:0 auto;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.grabber{width:44px;height:5px;border-radius:99px;background:#ddd;margin:0 auto 16px}
.panel h2{font-size:24px;margin:0 0 16px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.quick button{border:1px solid var(--line);background:#fafafa;border-radius:12px;padding:10px 6px;font-size:12px;font-weight:700}
.field{margin-bottom:12px}.field label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin:0 0 6px 2px}input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px 13px;font-size:17px;background:#fff;outline:none}.amount-input{font-size:28px;font-weight:800}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.type-toggle button{border:1px solid var(--line);background:#fafafa;border-radius:13px;padding:12px;font-weight:800;font-size:14px}.type-toggle button.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.save{width:100%;border:0;background:var(--dark);color:#fff;border-radius:15px;padding:15px;font-size:17px;font-weight:800}.overview{display:none}.overview.active{display:block}.transactions.hidden{display:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.card .k{font-size:11px;color:var(--muted);font-weight:700}.card .v{font-size:21px;font-weight:800;margin-top:6px}
.back{border:0;background:transparent;font-size:15px;font-weight:700;padding:0}.note{margin-top:12px;background:var(--soft);border-radius:16px;padding:14px;font-size:12px;color:#5d594d;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="monthline"><div><div class="small">PERSONAL EXPENSE</div><h1 id="title">Giao dịch</h1></div><button id="backBtn" class="back" style="display:none">← Quay lại</button></div>
    <div class="months" id="months"></div>
  </div>
  <section id="transactions" class="transactions">
    <div class="balance"><div class="label">CÒN LẠI</div><div class="value" id="remain">—</div><div class="meta"><span id="incomeMeta">Thu —</span><span id="expenseMeta">Chi —</span></div></div>
    <div id="txList" class="list"></div>
  </section>
  <section id="overview" class="overview">
    <div class="cards">
      <div class="card"><div class="k">Tổng thu</div><div class="v" id="ovIncome">—</div></div>
      <div class="card"><div class="k">Tổng chi</div><div class="v" id="ovExpense">—</div></div>
      <div class="card"><div class="k">Còn lại</div><div class="v" id="ovRemain">—</div></div>
      <div class="card"><div class="k">Tiết kiệm</div><div class="v" id="ovSavings">—</div></div>
    </div>
    <div class="note">Bản mobile-first ưu tiên nhập giao dịch nhanh. Có thể thêm ra màn hình chính iPhone để dùng như một app prototype.</div>
  </section>
</div>

<div class="fab"><button class="overview-btn" id="overviewBtn">Tổng quan</button><button class="add" id="addBtn">＋ Giao dịch</button></div>

<div class="sheet" id="sheet"><div class="panel">
  <div class="grabber"></div><h2>Thêm giao dịch</h2>
  <div class="quick">
    <button data-name="Tennis">Tennis</button><button data-name="Taxi đi làm">Taxi</button><button data-name="Ăn uống">Ăn uống</button><button data-name="Shopee">Shopee</button>
    <button data-name="Tiền điện">Điện</button><button data-name="Internet">Internet</button><button data-name="Sunny">Sunny</button><button data-name="">Khác</button>
  </div>
  <div class="type-toggle"><button class="active" data-type="expense">Chi</button><button data-type="income">Thu</button></div>
  <div class="field"><label>SỐ TIỀN</label><input class="amount-input" id="amount" inputmode="numeric" placeholder="220000"></div>
  <div class="field"><label>NỘI DUNG</label><input id="desc" placeholder="Ví dụ: Tennis"></div>
  <div class="field"><label>NGÀY</label><input id="date" type="date"></div>
  <button class="save" id="saveBtn">Lưu giao dịch</button>
</div></div>

let current=8, entryType='expense';
let manual=JSON.parse(localStorage.getItem('mobile_expense_manual')||'[]');
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Number(n||0))+' ₫';
const months=document.getElementById('months');
for(let m=1;m<=8;m++){const b=document.createElement('button');b.textContent='T'+m;b.dataset.m=m;b.onclick=()=>{current=m;render()};months.appendChild(b)}
function special(n){return ['tổng','đưa vợ','tiết kiệm','bỏ vào tiết kiệm','còn lại','còn lại ngân hàng','chênh lệch (ăn uống)'].includes((n||'').trim().toLowerCase())}
function rowsForMonth(m){
  const base=(DATA[m]?.rows||[]).filter(r=>!special(r.description)&&r.kind!=='saving').map(r=>({...r,isoDate:r.date&&r.date.includes('/')?`2026-${String(m).padStart(2,'0')}-${r.date.split('/')[0].padStart(2,'0')}`:''}));
  const add=manual.filter(x=>x.month===m);
  return [...base,...add].sort((a,b)=>String(b.isoDate||'').localeCompare(String(a.isoDate||'')));
}
function summary(m){
  const total=(DATA[m]?.rows||[]).find(r=>(r.description||'').trim().toLowerCase()==='tổng');
  const remainRow=(DATA[m]?.rows||[]).find(r=>(r.description||'').trim().toLowerCase()==='còn lại');
  let income=Number(total?.income||0), expense=Number(total?.expense||0);
  let remain=remainRow?Number(remainRow.expense||remainRow.income||0):(income-expense);
  manual.filter(x=>x.month===m).forEach(x=>{income+=Number(x.income||0);expense+=Number(x.expense||0);remain+=Number(x.income||0)-Number(x.expense||0)});
  return {income,expense,remain};
}
function render(){
  document.querySelectorAll('#months button').forEach(b=>b.classList.toggle('active',+b.dataset.m===current));
  const s=summary(current);
  remain.textContent=fmt(s.remain);incomeMeta.textContent='Thu '+fmt(s.income);expenseMeta.textContent='Chi '+fmt(s.expense);
  ovIncome.textContent=fmt(s.income);ovExpense.textContent=fmt(s.expense);ovRemain.textContent=fmt(s.remain);ovSavings.textContent=DATA[current]?.savings_balance?fmt(DATA[current].savings_balance):'—';
  const rows=rowsForMonth(current);
  txList.innerHTML=rows.length?rows.map(r=>{
    const inc=Number(r.income||0),exp=Number(r.expense||0), money=inc?`+${fmt(inc)}`:`-${fmt(exp)}`, cls=inc?'income':'expense';
    return `<div class="tx"><div><div class="tx-title">${r.description||''}</div><div class="tx-date">${r.date||''}</div></div><div class="tx-money ${cls}">${money}</div></div>`
  }).join(''):'<div class="empty">Chưa có giao dịch</div>';
}
function openSheet(){sheet.classList.add('open');desc.value='';amount.value='';date.value=new Date().toISOString().slice(0,10)}
function closeSheet(){sheet.classList.remove('open')}
addBtn.onclick=openSheet;sheet.onclick=e=>{if(e.target===sheet)closeSheet()}
document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{desc.value=b.dataset.name||'';(b.dataset.name?amount:desc).focus()})
document.querySelectorAll('.type-toggle button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.type-toggle button').forEach(x=>x.classList.remove('active'));b.classList.add('active');entryType=b.dataset.type})
saveBtn.onclick=()=>{
  const n=Number((amount.value||'').replace(/\D/g,''));if(!n||!desc.value.trim())return;
  const d=date.value||new Date().toISOString().slice(0,10), p=d.split('-');
  manual.push({month:Number(p[1]),description:desc.value.trim(),date:`${p[2]}/${p[1]}`,isoDate:d,income:entryType==='income'?n:0,expense:entryType==='expense'?n:0});
  localStorage.setItem('mobile_expense_manual',JSON.stringify(manual));current=Number(p[1]);closeSheet();render()
}
overviewBtn.onclick=()=>{transactions.classList.add('hidden');overview.classList.add('active');title.textContent='Tổng quan';backBtn.style.display='block'}
backBtn.onclick=()=>{transactions.classList.remove('hidden');overview.classList.remove('active');title.textContent='Giao dịch';backBtn.style.display='none'}
render();
