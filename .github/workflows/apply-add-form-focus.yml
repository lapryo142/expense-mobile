name: Apply Happy Money add form patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-add-form-focus.yml'

permissions:
  contents: write

jobs:
  patch-add-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'id="amount" class="amount" inputmode="numeric" placeholder="220.000"',
              'id="amount" class="amount" inputmode="numeric"',
              'remove amount placeholder'
          )

          replace_once(
              "$('category').addEventListener('change',()=>{categoryManuallySelected=true});",
              "$('category').addEventListener('change',()=>{categoryManuallySelected=true;$('amount').focus()});",
              'category select focus'
          )

          replace_once(
              "document.querySelectorAll('#quickExpense button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.quick button.selected').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');categoryManuallySelected=true;$('category').value=button.dataset.category;$('desc').focus()}));",
              "document.querySelectorAll('#quickExpense button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.quick button.selected').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');categoryManuallySelected=true;$('category').value=button.dataset.category;$('amount').focus()}));",
              'quick expense focus'
          )

          path.write_text(text)
          PY

          git config user.name "lapryo142"
          git config user.email "votatlap@gmail.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve add transaction amount entry"
          git push origin main
